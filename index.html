<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>Hand AR Frame</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;

  font-family:
    Arial,
    sans-serif;
}

/* CAMERA */

#video {
  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: 1;
}


/* EFFECT CANVAS */

#canvas {
  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 5;

  pointer-events: none;
}


/* START */

#start {
  position: fixed;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  padding: 18px 28px;

  border: none;

  border-radius: 18px;

  background: white;

  color: black;

  font-size: 17px;

  font-weight: bold;

  z-index: 50;
}


/* STATUS */

#status {
  position: fixed;

  top: 20px;
  left: 50%;

  transform:
    translateX(-50%);

  padding: 10px 18px;

  border-radius: 30px;

  color: white;

  background:
    rgba(0,0,0,.6);

  backdrop-filter:
    blur(10px);

  z-index: 30;

  white-space: nowrap;
}


/* INSTRUCTION */

#instruction {
  position: fixed;

  left: 50%;
  bottom: 95px;

  transform:
    translateX(-50%);

  width: 90%;

  text-align: center;

  color: white;

  font-size: 15px;

  text-shadow:
    0 2px 8px black;

  z-index: 30;
}


/* PHOTO BUTTON */

#photo {
  position: fixed;

  left: 50%;
  bottom: 20px;

  transform:
    translateX(-50%);

  width: 65px;
  height: 65px;

  border-radius: 50%;

  border: 5px solid white;

  background: rgba(255,255,255,.2);

  display: none;

  z-index: 40;
}

#photo::after {
  content: "";

  position: absolute;

  width: 45px;
  height: 45px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%,-50%);

  border-radius: 50%;

  background: white;
}


/* ERROR */

#error {
  position: fixed;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%,-50%);

  width: 90%;
  max-width: 450px;

  padding: 25px;

  border-radius: 20px;

  background:
    rgba(20,20,20,.95);

  color: white;

  text-align: center;

  display: none;

  z-index: 100;
}
</style>
</head>


<body>


<video
  id="video"
  autoplay
  playsinline
  muted
></video>


<canvas id="canvas"></canvas>


<div id="status">
  Kamera belum aktif
</div>


<div id="instruction">
  Tekan tombol untuk memulai
</div>


<button id="start">
  📷 Aktifkan Kamera Belakang
</button>


<button id="photo"></button>


<div id="error">
  <h2>Kamera gagal</h2>

  <p id="errorText"></p>

  <button onclick="location.reload()">
    Coba Lagi
  </button>
</div>


<script type="module">

/* =====================================================
   MEDIAPIPE
===================================================== */

import {
  HandLandmarker,
  FilesetResolver
} from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/* =====================================================
   ELEMENT
===================================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const start =
  document.getElementById("start");

const photo =
  document.getElementById("photo");

const status =
  document.getElementById("status");

const instruction =
  document.getElementById("instruction");

const error =
  document.getElementById("error");

const errorText =
  document.getElementById("errorText");


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let tracker = null;

let lastTime = -1;

let frame = null;

let effectTime = 0;


/* =====================================================
   START CAMERA
===================================================== */

start.onclick =
async function() {

  try {

    status.innerText =
      "Meminta izin kamera...";


    /*
      KAMERA BELAKANG
    */

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    await video.play();


    start.style.display =
      "none";


    photo.style.display =
      "block";


    resize();


    status.innerText =
      "Memuat Hand Tracking...";


    /*
      LOAD MEDIAPIPE
    */

    const vision =
      await FilesetResolver
        .forVisionTasks(

          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


    tracker =
      await HandLandmarker
        .createFromOptions(

          vision,

          {

            baseOptions: {

              modelAssetPath:

              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

              delegate: "GPU"

            },

            runningMode: "VIDEO",

            numHands: 2,

            minHandDetectionConfidence:
              0.5,

            minHandPresenceConfidence:
              0.5,

            minTrackingConfidence:
              0.5

          }

        );


    status.innerText =
      "✋ Hand Tracking Aktif";


    instruction.innerText =
      "Gunakan ibu jari + telunjuk kedua tangan untuk membuat frame";


    requestAnimationFrame(loop);

  }

  catch (e) {

    console.error(e);

    error.style.display =
      "block";

    errorText.innerText =
      e.message;

  }

};


/* =====================================================
   RESIZE
===================================================== */

function resize() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}


window.addEventListener(
  "resize",
  resize
);


/* =====================================================
   LOOP
===================================================== */

function loop() {

  if (!tracker) {

    requestAnimationFrame(loop);

    return;

  }


  if (
    video.currentTime !==
    lastTime
  ) {

    lastTime =
      video.currentTime;


    const result =
      tracker.detectForVideo(

        video,

        performance.now()

      );


    process(result);

  }


  effectTime += 0.025;


  requestAnimationFrame(loop);

}


/* =====================================================
   PROCESS HAND
===================================================== */

function process(result) {

  frame = null;


  if (
    !result.landmarks ||
    result.landmarks.length < 2
  ) {

    instruction.innerText =
      "👐 Tunjukkan kedua tangan";

    drawNormal();

    return;

  }


  const hand1 =
    result.landmarks[0];

  const hand2 =
    result.landmarks[1];


  /*
    TITIK YANG DIPAKAI:

    4 = ujung ibu jari
    8 = ujung telunjuk
  */


  const a =
    point(hand1[8]);

  const b =
    point(hand2[8]);

  const c =
    point(hand2[4]);

  const d =
    point(hand1[4]);


  /*
    FRAME
  */

  const minX =
    Math.min(
      a.x,
      b.x,
      c.x,
      d.x
    );

  const maxX =
    Math.max(
      a.x,
      b.x,
      c.x,
      d.x
    );

  const minY =
    Math.min(
      a.y,
      b.y,
      c.y,
      d.y
    );

  const maxY =
    Math.max(
      a.y,
      b.y,
      c.y,
      d.y
    );


  const width =
    maxX - minX;

  const height =
    maxY - minY;


  /*
    TERLALU KECIL
  */

  if (
    width < 100 ||
    height < 80
  ) {

    instruction.innerText =
      "↔️ Jauhkan tangan sedikit";

    drawNormal();

    return;

  }


  frame = {

    x: minX,

    y: minY,

    width: width,

    height: height,

    points: [
      a,
      b,
      c,
      d
    ]

  };


  instruction.innerText =
    "🟢 FRAME TERDETEKSI";


  drawEffect();

}


/* =====================================================
   NORMAL BACKGROUND
===================================================== */

function drawNormal() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}


/* =====================================================
   EFFECT
===================================================== */

function drawEffect() {

  /*
    Kita tidak menggambar ulang kamera
    ke canvas.

    Video tetap menjadi background.

    Canvas hanya menggambar:

    - dark overlay
    - frame
    - efek warna
  */


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (!frame)
    return;


  const {
    x,
    y,
    width,
    height
  } = frame;


  /*
    ==================================================
    DARK AREA DI LUAR FRAME
    ==================================================
  */

  ctx.save();


  ctx.fillStyle =
    "rgba(0,0,0,0.38)";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    HAPUS AREA FRAME
  */

  ctx.globalCompositeOperation =
    "destination-out";


  ctx.fillStyle =
    "rgba(255,255,255,1)";


  ctx.fillRect(
    x,
    y,
    width,
    height
  );


  ctx.restore();


  /*
    ==================================================
    WARNA DI DALAM FRAME
    ==================================================
  */


  ctx.save();


  ctx.beginPath();


  ctx.rect(
    x,
    y,
    width,
    height
  );


  ctx.clip();


  /*
    Gradient bergerak
  */

  const gradient =
    ctx.createLinearGradient(

      x,
      y,

      x + width,
      y + height

    );


  const t =
    effectTime;


  gradient.addColorStop(
    0,
    `hsl(${(t*80)%360},100%,55%)`
  );


  gradient.addColorStop(
    0.25,
    `hsl(${(t*80+80)%360},100%,55%)`
  );


  gradient.addColorStop(
    0.5,
    `hsl(${(t*80+160)%360},100%,55%)`
  );


  gradient.addColorStop(
    0.75,
    `hsl(${(t*80+240)%360},100%,55%)`
  );


  gradient.addColorStop(
    1,
    `hsl(${(t*80+320)%360},100%,55%)`
  );


  ctx.globalAlpha =
    0.35;


  ctx.fillStyle =
    gradient;


  ctx.fillRect(
    x,
    y,
    width,
    height
  );


  /*
    GARIS WARNA
  */

  for (
    let i = 0;
    i < 12;
    i++
  ) {

    const yy =
      y +
      (
        i / 12
      ) *
      height;


    ctx.fillStyle =
      `hsla(${(
        effectTime * 100 +
        i * 40
      ) % 360},100%,60%,0.22)`;


    ctx.fillRect(
      x,
      yy,
      width,
      height / 12
    );

  }


  ctx.restore();


  /*
    ==================================================
    BORDER FRAME
    ==================================================
  */


  ctx.save();


  ctx.strokeStyle =
    "white";


  ctx.lineWidth =
    3;


  ctx.shadowBlur =
    18;


  ctx.shadowColor =
    "#00ffff";


  ctx.strokeRect(
    x,
    y,
    width,
    height
  );


  ctx.restore();


  /*
    ==================================================
    CORNER
    ==================================================
  */

  drawCorners(
    x,
    y,
    width,
    height
  );

}


/* =====================================================
   CORNERS
===================================================== */

function drawCorners(
  x,
  y,
  w,
  h
) {

  const size =
    Math.min(
      35,
      Math.min(w,h) * 0.2
    );


  ctx.save();


  ctx.strokeStyle =
    "white";


  ctx.lineWidth =
    5;


  ctx.shadowBlur =
    15;


  ctx.shadowColor =
    "#00ffff";


  /*
    TOP LEFT
  */

  ctx.beginPath();

  ctx.moveTo(
    x,
    y + size
  );

  ctx.lineTo(
    x,
    y
  );

  ctx.lineTo(
    x + size,
    y
  );

  ctx.stroke();


  /*
    TOP RIGHT
  */

  ctx.beginPath();

  ctx.moveTo(
    x + w - size,
    y
  );

  ctx.lineTo(
    x + w,
    y
  );

  ctx.lineTo(
    x + w,
    y + size
  );

  ctx.stroke();


  /*
    BOTTOM LEFT
  */

  ctx.beginPath();

  ctx.moveTo(
    x,
    y + h - size
  );

  ctx.lineTo(
    x,
    y + h
  );

  ctx.lineTo(
    x + size,
    y + h
  );

  ctx.stroke();


  /*
    BOTTOM RIGHT
  */

  ctx.beginPath();

  ctx.moveTo(
    x + w - size,
    y + h
  );

  ctx.lineTo(
    x + w,
    y + h
  );

  ctx.lineTo(
    x + w,
    y + h - size
  );

  ctx.stroke();


  ctx.restore();

}


/* =====================================================
   POINT
===================================================== */

function point(p) {

  return {

    x:
      p.x *
      canvas.width,

    y:
      p.y *
      canvas.height

  };

}


/* =====================================================
   PHOTO
===================================================== */

photo.onclick =
function() {

  /*
    Buat foto dari kamera.
  */

  const out =
    document.createElement("canvas");


  out.width =
    video.videoWidth;


  out.height =
    video.videoHeight;


  const octx =
    out.getContext("2d");


  /*
    Kamera
  */

  octx.drawImage(
    video,
    0,
    0,
    out.width,
    out.height
  );


  /*
    Download
  */

  const link =
    document.createElement("a");


  link.download =
    "hand-frame-" +
    Date.now() +
    ".jpg";


  link.href =
    out.toDataURL(
      "image/jpeg",
      0.95
    );


  link.click();

};

</script>

</body>
</html>
