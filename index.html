<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Card - KYZZ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
            overflow: hidden;
        }

        h2 {
            color: white;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .camera-section {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #video {
            width: 400px;
            height: 500px;
            background: #000;
            border-radius: 15px;
            transform: scaleX(-1);
            display: block;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 15px;
        }

        .info-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            z-index: 20;
            min-width: 120px;
        }

        .gesture-display {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 16px;
            border-radius: 8px;
            color: #00ff00;
            font-size: 14px;
            font-weight: bold;
            z-index: 20;
            text-align: center;
            min-width: 100px;
        }

        .gesture-display.triangle { color: #ff006e; }
        .gesture-display.peace { color: #00f5ff; }
        .gesture-display.ok { color: #06ffa5; }
        .gesture-display.thumbs { color: #ffbe0b; }
        .gesture-display.rock { color: #fb5607; }

        .card-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .card {
            width: 280px;
            height: 160px;
            background: linear-gradient(45deg, #ff006e, #fb5607, #ffbe0b, #8338ec);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            align-content: center;
            transition: transform 0.05s ease-out;
        }

        .card.shake {
            animation: shake 0.3s ease-in-out;
        }

        .card.pulse {
            animation: pulse 0.5s ease-in-out;
        }

        .card.spin {
            animation: spin 0.8s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotateZ(0deg); }
            25% { transform: translateX(-5px) rotateZ(-1deg); }
            75% { transform: translateX(5px) rotateZ(1deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes spin {
            0% { transform: rotateZ(0deg); }
            100% { transform: rotateZ(360deg); }
        }

        .pattern {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        .pattern:nth-child(1) { animation-delay: 0s; }
        .pattern:nth-child(2) { animation-delay: 0.2s; }
        .pattern:nth-child(3) { animation-delay: 0.4s; }
        .pattern:nth-child(4) { animation-delay: 0.6s; }
        .pattern:nth-child(5) { animation-delay: 0.8s; }
        .pattern:nth-child(6) { animation-delay: 1s; }
        .pattern:nth-child(7) { animation-delay: 1.2s; }
        .pattern:nth-child(8) { animation-delay: 1.4s; }
        .pattern:nth-child(9) { animation-delay: 1.6s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .watermark {
            position: absolute;
            bottom: 8px;
            right: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 11px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #8338ec, #3a86ff);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(131, 56, 236, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(131, 56, 236, 0.6);
        }

        .info {
            color: #06ffa5;
            text-align: center;
            font-size: 12px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            max-width: 300px;
            line-height: 1.5;
        }

        .gesture-hints {
            color: #ffbe0b;
            font-size: 11px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            margin-top: 10px;
            max-width: 300px;
            line-height: 1.4;
        }

        @media (max-width: 800px) {
            #video {
                width: 100%;
                height: auto;
                max-width: 400px;
                aspect-ratio: 4 / 5;
            }

            .card {
                width: 240px;
                height: 140px;
            }

            h2 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <h2>🎨 Hand Gesture Card - BY KYZZ</h2>

    <div class="main-container">
        <div class="camera-section">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="info-overlay" id="status">
                <span style="color: #ffbe0b;">⏳ Loading...</span>
            </div>
            <div class="gesture-display" id="gesture">
                No Gesture
            </div>
        </div>

        <div class="card-section">
            <div class="card" id="card">
                <div class="pattern" style="background: #ff006e;">◉</div>
                <div class="pattern" style="background: #fb5607;">◉</div>
                <div class="pattern" style="background: #ffbe0b;">◉</div>
                <div class="pattern" style="background: #8338ec;">◉</div>
                <div class="pattern" style="background: #3a86ff;">◉</div>
                <div class="pattern" style="background: #06ffa5;">◉</div>
                <div class="pattern" style="background: #ff85a1;">◉</div>
                <div class="pattern" style="background: #faa43a;">◉</div>
                <div class="pattern" style="background: #00f5ff;">◉</div>
                <div class="watermark">BY KYZZ</div>
            </div>

            <div class="controls">
                <button onclick="randomizeColors()">🎨 Random Colors</button>
            </div>

            <div class="info">
                💡 Tunjukkan tangan ke kamera dan bentuk gesture!
            </div>

            <div class="gesture-hints">
                ✋ Peace (2 jari) = Shake<br>
                🔺 Triangle (3 jari) = Pulse<br>
                👍 Thumbs Up = Spin<br>
                ✌️ Rock (2 jari) = Random Color
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const card = document.getElementById('card');
        const statusDiv = document.getElementById('status');
        const gestureDiv = document.getElementById('gesture');
        const patterns = document.querySelectorAll('.pattern');

        let detector = null;
        let lastGestureTime = 0;
        const GESTURE_COOLDOWN = 500; // ms

        const allColors = [
            '#ff006e', '#fb5607', '#ffbe0b', '#8338ec', '#3a86ff', 
            '#06ffa5', '#ff85a1', '#faa43a', '#00f5ff', '#ff1744'
        ];

        // Distance calculator
        function distance(p1, p2) {
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Get finger tip position
        function getFingerTip(keypoints, fingerIndex) {
            // Finger tips: 4(thumb), 8(index), 12(middle), 16(ring), 20(pinky)
            const tips = [4, 8, 12, 16, 20];
            return keypoints[tips[fingerIndex]];
        }

        // Count raised fingers
        function countRaisedFingers(keypoints) {
            let count = 0;
            for (let i = 0; i < 5; i++) {
                const tip = getFingerTip(keypoints, i);
                const pip = keypoints[tips[i] - 2]; // PIP joint
                if (tip && pip && tip.score > 0.5 && pip.score > 0.5) {
                    if (tip.y < pip.y) { // Jari raised
                        count++;
                    }
                }
            }
            return count;
        }

        const tips = [4, 8, 12, 16, 20];

        // Recognize gesture
        function recognizeGesture(keypoints) {
            if (!keypoints || keypoints.length < 21) return null;

            // Count raised fingers
            let raisedCount = 0;
            for (let i = 0; i < 5; i++) {
                const tip = getFingerTip(keypoints, i);
                const pip = keypoints[tips[i] - 2];
                if (tip && pip && tip.score > 0.5 && pip.score > 0.5) {
                    if (tip.y < pip.y) raisedCount++;
                }
            }

            // Check thumbs up - thumb pointing up
            const thumbTip = keypoints[4];
            const thumbPip = keypoints[3];
            const indexTip = keypoints[8];
            if (thumbTip && thumbPip && thumbTip.score > 0.5 && thumbPip.score > 0.5) {
                if (thumbTip.y < thumbPip.y - 30 && Math.abs(thumbTip.x - indexTip.x) < 30) {
                    return 'THUMBS_UP';
                }
            }

            // Check peace/rock - 2 fingers
            if (raisedCount === 2) {
                const indexTip = keypoints[8];
                const middleTip = keypoints[12];
                const distance2Fingers = indexTip && middleTip ? 
                    distance(indexTip, middleTip) : 0;
                
                if (distance2Fingers > 20) {
                    return 'PEACE';
                } else {
                    return 'ROCK';
                }
            }

            // Check triangle - 3 fingers
            if (raisedCount === 3) {
                const indexTip = keypoints[8];
                const middleTip = keypoints[12];
                const ringTip = keypoints[16];
                
                if (indexTip && middleTip && ringTip &&
                    indexTip.score > 0.5 && middleTip.score > 0.5 && ringTip.score > 0.5) {
                    return 'TRIANGLE';
                }
            }

            // Check OK sign - thumb dan index close, other fingers up
            if (raisedCount >= 3) {
                const thumbTip = keypoints[4];
                const indexTip = keypoints[8];
                if (thumbTip && indexTip && 
                    distance(thumbTip, indexTip) < 20) {
                    return 'OK_SIGN';
                }
            }

            return null;
        }

        // Trigger gesture effect
        function triggerGestureEffect(gesture) {
            const now = Date.now();
            if (now - lastGestureTime < GESTURE_COOLDOWN) return;
            lastGestureTime = now;

            switch(gesture) {
                case 'PEACE':
                    gestureDiv.textContent = '✌️ Peace!';
                    gestureDiv.className = 'gesture-display peace';
                    card.classList.remove('shake', 'pulse', 'spin');
                    card.classList.add('shake');
                    break;
                case 'TRIANGLE':
                    gestureDiv.textContent = '🔺 Triangle!';
                    gestureDiv.className = 'gesture-display triangle';
                    card.classList.remove('shake', 'pulse', 'spin');
                    card.classList.add('pulse');
                    break;
                case 'THUMBS_UP':
                    gestureDiv.textContent = '👍 Thumbs Up!';
                    gestureDiv.className = 'gesture-display thumbs';
                    card.classList.remove('shake', 'pulse', 'spin');
                    card.classList.add('spin');
                    break;
                case 'ROCK':
                    gestureDiv.textContent = '🤘 Rock!';
                    gestureDiv.className = 'gesture-display rock';
                    randomizeColors();
                    break;
                case 'OK_SIGN':
                    gestureDiv.textContent = '👌 OK!';
                    gestureDiv.className = 'gesture-display ok';
                    randomizeColors();
                    break;
            }
        }

        // Initialize
        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 400 },
                        height: { ideal: 500 }
                    }
                });

                video.srcObject = stream;

                const model = await handPoseDetection.createDetector(
                    handPoseDetection.SupportedModels.MediaPipeHands,
                    { runtime: 'tfjs' }
                );
                detector = model;

                statusDiv.innerHTML = '✅ Ready!';
                statusDiv.style.color = '#06ffa5';

                detectHands();
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = '❌ Error';
                statusDiv.style.color = '#ff1744';
            }
        }

        // Detect hands
        async function detectHands() {
            if (!detector) {
                requestAnimationFrame(detectHands);
                return;
            }

            try {
                const hands = await detector.estimateHands(video);

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (hands.length > 0) {
                    const hand = hands[0];
                    const keypoints = hand.keypoints;

                    if (keypoints && keypoints.length > 0) {
                        // Draw skeleton
                        ctx.strokeStyle = '#00ffff';
                        ctx.lineWidth = 2;
                        ctx.fillStyle = '#00ff00';

                        keypoints.forEach((point) => {
                            if (point.score > 0.5) {
                                ctx.beginPath();
                                ctx.arc(point.x, point.y, 3, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        });

                        // Draw connections
                        const connections = [
                            [0, 1], [1, 2], [2, 3], [3, 4],
                            [0, 5], [5, 6], [6, 7], [7, 8],
                            [0, 9], [9, 10], [10, 11], [11, 12],
                            [0, 13], [13, 14], [14, 15], [15, 16],
                            [0, 17], [17, 18], [18, 19], [19, 20]
                        ];

                        connections.forEach(([start, end]) => {
                            const startPoint = keypoints[start];
                            const endPoint = keypoints[end];
                            if (startPoint.score > 0.5 && endPoint.score > 0.5) {
                                ctx.beginPath();
                                ctx.moveTo(startPoint.x, startPoint.y);
                                ctx.lineTo(endPoint.x, endPoint.y);
                                ctx.stroke();
                            }
                        });

                        // Control card
                        const controlPoint = keypoints[8];
                        if (controlPoint && controlPoint.score > 0.5) {
                            const normalizedX = (controlPoint.x / canvas.width) * 2 - 1;
                            const normalizedY = (controlPoint.y / canvas.height) * 2 - 1;

                            const rotateX = normalizedY * 20;
                            const rotateY = normalizedX * 20;

                            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                        }

                        // Recognize gesture
                        const gesture = recognizeGesture(keypoints);
                        if (gesture) {
                            triggerGestureEffect(gesture);
                        }
                    }
                } else {
                    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
                    gestureDiv.textContent = 'No Gesture';
                    gestureDiv.className = 'gesture-display';
                }
            } catch (error) {
                console.error('Detection error:', error);
            }

            requestAnimationFrame(detectHands);
        }

        // Random colors
        function randomizeColors() {
            patterns.forEach((pattern) => {
                const randomColor = allColors[Math.floor(Math.random() * allColors.length)];
                pattern.style.background = randomColor;
            });
        }

        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        });

        init();
    </script>
</body>
</html>
