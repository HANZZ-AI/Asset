<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Hand Gesture Camera</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       CAMERA
    ========================= */

    #video {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #000;

      z-index: 1;
    }

    /* =========================
       CANVAS
    ========================= */

    #canvas {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 5;
    }

    /* =========================
       STATUS
    ========================= */

    #topBar {
      position: fixed;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      padding: 10px 18px;

      border-radius: 30px;

      color: white;

      background: rgba(0, 0, 0, 0.65);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      font-size: 14px;

      text-align: center;

      white-space: nowrap;

      z-index: 20;
    }

    /* =========================
       START BUTTON
    ========================= */

    #start {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      padding: 18px 28px;

      border: none;

      border-radius: 18px;

      background: white;
      color: #111;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.4);

      z-index: 50;
    }

    #start:active {
      transform:
        translate(-50%, -50%)
        scale(0.95);
    }

    /* =========================
       INSTRUCTION
    ========================= */

    #instruction {
      position: fixed;

      left: 50%;
      bottom: 105px;

      transform: translateX(-50%);

      width: calc(100% - 40px);
      max-width: 500px;

      padding: 12px 18px;

      border-radius: 16px;

      background: rgba(0, 0, 0, 0.55);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      color: white;

      text-align: center;

      font-size: 14px;

      z-index: 20;
    }

    /* =========================
       SHUTTER
    ========================= */

    #shutter {
      position: fixed;

      left: 50%;
      bottom: 22px;

      transform: translateX(-50%);

      width: 68px;
      height: 68px;

      padding: 0;

      border-radius: 50%;

      border: 5px solid white;

      background: rgba(255, 255, 255, 0.18);

      box-shadow:
        0 5px 30px rgba(0, 0, 0, 0.4);

      cursor: pointer;

      display: none;

      z-index: 30;
    }

    #shutter::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      width: 48px;
      height: 48px;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background: white;
    }

    #shutter:active {
      transform:
        translateX(-50%)
        scale(0.9);
    }

    /* =========================
       FLASH
    ========================= */

    #flash {
      position: fixed;

      inset: 0;

      background: white;

      opacity: 0;

      pointer-events: none;

      z-index: 100;
    }

    /* =========================
       ERROR
    ========================= */

    #errorBox {
      position: fixed;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      width: calc(100% - 40px);
      max-width: 500px;

      padding: 20px;

      border-radius: 18px;

      background:
        rgba(20, 20, 20, 0.95);

      color: white;

      text-align: center;

      display: none;

      z-index: 1000;
    }

    #errorBox h3 {
      margin-top: 0;
    }

    #errorBox button {
      margin-top: 15px;

      padding: 10px 18px;

      border: none;

      border-radius: 10px;

      cursor: pointer;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      position: fixed;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      display: none;

      color: white;

      text-align: center;

      z-index: 60;
    }

    .spinner {
      width: 45px;
      height: 45px;

      margin: auto;
      margin-bottom: 12px;

      border: 4px solid rgba(255,255,255,0.25);

      border-top-color: white;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>


<body>


  <!-- =========================
       CAMERA
  ========================= -->

  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>


  <!-- =========================
       HAND TRACKING CANVAS
  ========================= -->

  <canvas id="canvas"></canvas>


  <!-- =========================
       STATUS
  ========================= -->

  <div id="topBar">
    Kamera belum aktif
  </div>


  <!-- =========================
       INSTRUCTION
  ========================= -->

  <div id="instruction">
    Tekan tombol untuk mengaktifkan kamera belakang
  </div>


  <!-- =========================
       START
  ========================= -->

  <button id="start">
    📷 Aktifkan Kamera Belakang
  </button>


  <!-- =========================
       SHUTTER
  ========================= -->

  <button
    id="shutter"
    aria-label="Ambil foto"
  ></button>


  <!-- =========================
       FLASH
  ========================= -->

  <div id="flash"></div>


  <!-- =========================
       LOADING
  ========================= -->

  <div id="loading">

    <div class="spinner"></div>

    <div>
      Memuat hand tracking...
    </div>

  </div>


  <!-- =========================
       ERROR
  ========================= -->

  <div id="errorBox">

    <h3>
      Kamera / Hand Tracking bermasalah
    </h3>

    <p id="errorText"></p>

    <button onclick="location.reload()">
      Coba Lagi
    </button>

  </div>


  <script>


    // =====================================================
    // ELEMENT
    // =====================================================

    const video =
      document.getElementById("video");

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");

    const start =
      document.getElementById("start");

    const shutter =
      document.getElementById("shutter");

    const flash =
      document.getElementById("flash");

    const topBar =
      document.getElementById("topBar");

    const instruction =
      document.getElementById("instruction");

    const errorBox =
      document.getElementById("errorBox");

    const errorText =
      document.getElementById("errorText");

    const loading =
      document.getElementById("loading");


    // =====================================================
    // VARIABLES
    // =====================================================

    let stream = null;

    let handLandmarker = null;

    let lastVideoTime = -1;

    let frameActive = false;

    let starting = false;


    // =====================================================
    // CHECK CAMERA
    // =====================================================

    function checkCameraSupport() {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "Browser tidak mendukung akses kamera."
        );

      }

    }


    // =====================================================
    // START BUTTON
    // =====================================================

    start.addEventListener(
      "click",
      startCamera
    );


    // =====================================================
    // START CAMERA
    // =====================================================

    async function startCamera() {

      if (starting) {
        return;
      }

      starting = true;


      try {

        checkCameraSupport();


        topBar.textContent =
          "Meminta izin kamera...";


        instruction.textContent =
          "Jika muncul permintaan izin, tekan IZINKAN";


        // =================================================
        // KAMERA BELAKANG
        // =================================================

        const constraints = {

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        };


        console.log(
          "Meminta akses kamera..."
        );


        // =================================================
        // PERMISSION KAMERA
        // =================================================

        stream =
          await navigator
            .mediaDevices
            .getUserMedia(
              constraints
            );


        console.log(
          "Kamera berhasil dibuka!",
          stream
        );


        // =================================================
        // PASANG STREAM
        // =================================================

        video.srcObject =
          stream;


        await video.play();


        // =================================================
        // UI
        // =================================================

        start.style.display =
          "none";

        shutter.style.display =
          "block";


        resizeCanvas();


        topBar.textContent =
          "📷 Kamera belakang aktif";


        instruction.textContent =
          "Memuat hand tracking...";


        loading.style.display =
          "block";


        // =================================================
        // LOAD MEDIAPIPE
        // =================================================

        await loadMediaPipe();


        loading.style.display =
          "none";


        topBar.textContent =
          "✋ Hand tracking aktif";


        instruction.textContent =
          "Buat gesture L dengan kedua tangan";


        starting = false;


        requestAnimationFrame(
          loop
        );


      } catch (error) {

        starting = false;

        loading.style.display =
          "none";


        console.error(
          "ERROR:",
          error
        );


        showError(
          error
        );

      }

    }


    // =====================================================
    // LOAD MEDIAPIPE
    // =====================================================

    async function loadMediaPipe() {

      try {

        console.log(
          "Memuat MediaPipe..."
        );


        /*
         * ==================================================
         * PERBAIKAN UTAMA
         * ==================================================
         *
         * Menggunakan +esm.
         *
         * Ini memperbaiki error:
         *
         * Failed to fetch dynamically imported module
         */

        const module =
          await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
          );


        const HandLandmarker =
          module.HandLandmarker;

        const FilesetResolver =
          module.FilesetResolver;


        if (
          !HandLandmarker ||
          !FilesetResolver
        ) {

          throw new Error(
            "HandLandmarker atau FilesetResolver tidak ditemukan."
          );

        }


        console.log(
          "Library MediaPipe berhasil."
        );


        // =================================================
        // LOAD WASM
        // =================================================

        const vision =
          await FilesetResolver
            .forVisionTasks(

              "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

            );


        console.log(
          "WASM berhasil."
        );


        // =================================================
        // LOAD HAND LANDMARKER
        // =================================================

        handLandmarker =
          await HandLandmarker
            .createFromOptions(

              vision,

              {

                baseOptions: {

                  modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                  delegate:
                    "GPU"

                },


                runningMode:
                  "VIDEO",


                numHands:
                  2,


                minHandDetectionConfidence:
                  0.5,


                minHandPresenceConfidence:
                  0.5,


                minTrackingConfidence:
                  0.5

              }

            );


        console.log(
          "Hand Landmarker berhasil dibuat!"
        );

      }


      catch (error) {

        console.error(
          "MEDIAPIPE ERROR:",
          error
        );


        throw new Error(
          "Hand tracking gagal dimuat. " +
          error.message
        );

      }

    }


    // =====================================================
    // RESIZE
    // =====================================================

    function resizeCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    // =====================================================
    // MAIN LOOP
    // =====================================================

    function loop() {

      if (
        !handLandmarker ||
        video.readyState < 2
      ) {

        requestAnimationFrame(
          loop
        );

        return;

      }


      if (
        video.currentTime !==
        lastVideoTime
      ) {

        lastVideoTime =
          video.currentTime;


        try {

          const results =
            handLandmarker
              .detectForVideo(

                video,

                performance.now()

              );


          processHands(
            results
          );

        }

        catch (error) {

          console.error(
            "Detection error:",
            error
          );

        }

      }


      requestAnimationFrame(
        loop
      );

    }


    // =====================================================
    // DISTANCE
    // =====================================================

    function distance(a, b) {

      return Math.sqrt(

        Math.pow(
          a.x - b.x,
          2
        )

        +

        Math.pow(
          a.y - b.y,
          2
        )

      );

    }


    // =====================================================
    // DETEKSI GESTURE L
    // =====================================================

    function isLGesture(hand) {

      /*
       * MediaPipe:
       *
       * 4  = thumb tip
       * 8  = index tip
       * 12 = middle tip
       * 16 = ring tip
       * 20 = pinky tip
       *
       * 5  = index base
       * 9  = middle base
       * 13 = ring base
       * 17 = pinky base
       */


      const thumbTip =
        hand[4];

      const indexTip =
        hand[8];

      const middleTip =
        hand[12];

      const ringTip =
        hand[16];

      const pinkyTip =
        hand[20];


      const indexBase =
        hand[5];

      const middleBase =
        hand[9];

      const ringBase =
        hand[13];

      const pinkyBase =
        hand[17];


      // =================================================
      // TELUNJUK TERBUKA
      // =================================================

      const indexExtended =
        distance(
          indexTip,
          indexBase
        ) > 0.14;


      // =================================================
      // JARI TENGAH TERLIPAT
      // =================================================

      const middleFolded =
        distance(
          middleTip,
          middleBase
        ) < 0.16;


      // =================================================
      // JARI MANIS TERLIPAT
      // =================================================

      const ringFolded =
        distance(
          ringTip,
          ringBase
        ) < 0.16;


      // =================================================
      // KELINGKING TERLIPAT
      // =================================================

      const pinkyFolded =
        distance(
          pinkyTip,
          pinkyBase
        ) < 0.16;


      // =================================================
      // IBU JARI TERBUKA
      // =================================================

      const thumbOpen =
        distance(
          thumbTip,
          indexBase
        ) > 0.10;


      return (

        indexExtended &&

        middleFolded &&

        ringFolded &&

        pinkyFolded &&

        thumbOpen

      );

    }


    // =====================================================
    // PROCESS HANDS
    // =====================================================

    function processHands(results) {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      // =================================================
      // TIDAK ADA TANGAN
      // =================================================

      if (
        !results.landmarks ||
        results.landmarks.length === 0
      ) {

        frameActive =
          false;


        instruction.textContent =
          "✋ Tunjukkan kedua tangan";


        return;

      }


      // =================================================
      // GAMBAR LANDMARK
      // =================================================

      drawHands(
        results
      );


      // =================================================
      // CARI GESTURE L
      // =================================================

      const LHands = [];


      for (
        const hand
        of results.landmarks
      ) {

        if (
          isLGesture(hand)
        ) {

          LHands.push(
            hand
          );

        }

      }


      // =================================================
      // DUA TANGAN L
      // =================================================

      if (
        LHands.length >= 2
      ) {

        createFrame(
          LHands[0],
          LHands[1]
        );

        return;

      }


      // =================================================
      // BELUM DUA TANGAN
      // =================================================

      frameActive =
        false;


      if (
        results.landmarks.length === 1
      ) {

        instruction.textContent =
          "☝️ Satu tangan terdeteksi — gunakan kedua tangan";

      }

      else {

        instruction.textContent =
          "🖐️ Bentuk huruf L dengan kedua tangan";

      }

    }


    // =====================================================
    // DRAW HANDS
    // =====================================================

    function drawHands(results) {

      for (
        const hand
        of results.landmarks
      ) {

        // ===============================================
        // TITIK LANDMARK
        // ===============================================

        for (
          const point
          of hand
        ) {

          const x =
            point.x *
            canvas.width;

          const y =
            point.y *
            canvas.height;


          ctx.beginPath();


          ctx.arc(
            x,
            y,
            4,
            0,
            Math.PI * 2
          );


          ctx.fillStyle =
            "rgba(255,255,255,0.9)";


          ctx.fill();

        }


        // ===============================================
        // GARIS IBU JARI -> TELUNJUK
        // ===============================================

        const thumb =
          getPoint(
            hand[4]
          );


        const index =
          getPoint(
            hand[8]
          );


        ctx.beginPath();


        ctx.moveTo(
          thumb.x,
          thumb.y
        );


        ctx.lineTo(
          index.x,
          index.y
        );


        ctx.strokeStyle =
          "rgba(0,255,136,0.8)";


        ctx.lineWidth =
          3;


        ctx.stroke();

      }

    }


    // =====================================================
    // CREATE FRAME
    // =====================================================

    function createFrame(
      hand1,
      hand2
    ) {

      /*
       * Empat titik:
       *
       * hand1 index
       * hand2 index
       * hand2 thumb
       * hand1 thumb
       */


      const p1 =
        getPoint(
          hand1[8]
        );


      const p2 =
        getPoint(
          hand2[8]
        );


      const p3 =
        getPoint(
          hand2[4]
        );


      const p4 =
        getPoint(
          hand1[4]
        );


      // =================================================
      // BATAS FRAME
      // =================================================

      const minX =
        Math.min(
          p1.x,
          p2.x,
          p3.x,
          p4.x
        );


      const maxX =
        Math.max(
          p1.x,
          p2.x,
          p3.x,
          p4.x
        );


      const minY =
        Math.min(
          p1.y,
          p2.y,
          p3.y,
          p4.y
        );


      const maxY =
        Math.max(
          p1.y,
          p2.y,
          p3.y,
          p4.y
        );


      const width =
        maxX - minX;


      const height =
        maxY - minY;


      // =================================================
      // TERLALU KECIL
      // =================================================

      if (
        width < 100 ||
        height < 100
      ) {

        frameActive =
          false;


        instruction.textContent =
          "↔️ Jauhkan kedua tangan";


        return;

      }


      frameActive =
        true;


      // =================================================
      // FRAME
      // =================================================

      ctx.beginPath();


      ctx.moveTo(
        p1.x,
        p1.y
      );


      ctx.lineTo(
        p2.x,
        p2.y
      );


      ctx.lineTo(
        p3.x,
        p3.y
      );


      ctx.lineTo(
        p4.x,
        p4.y
      );


      ctx.closePath();


      // =================================================
      // GLOW
      // =================================================

      ctx.strokeStyle =
        "#00ff88";


      ctx.lineWidth =
        5;


      ctx.shadowBlur =
        20;


      ctx.shadowColor =
        "#00ff88";


      ctx.stroke();


      ctx.shadowBlur =
        0;


      // =================================================
      // AREA DALAM
      // =================================================

      ctx.fillStyle =
        "rgba(0,255,136,0.08)";


      ctx.fill();


      // =================================================
      // CORNER
      // =================================================

      drawCorner(
        p1.x,
        p1.y
      );


      drawCorner(
        p2.x,
        p2.y
      );


      drawCorner(
        p3.x,
        p3.y
      );


      drawCorner(
        p4.x,
        p4.y
      );


      instruction.textContent =
        "🟢 FRAME AKTIF — tekan 📸";

    }


    // =====================================================
    // DRAW CORNER
    // =====================================================

    function drawCorner(
      x,
      y
    ) {

      ctx.beginPath();


      ctx.arc(
        x,
        y,
        7,
        0,
        Math.PI * 2
      );


      ctx.fillStyle =
        "#ffffff";


      ctx.shadowBlur =
        12;


      ctx.shadowColor =
        "#00ff88";


      ctx.fill();


      ctx.shadowBlur =
        0;


      ctx.beginPath();


      ctx.arc(
        x,
        y,
        14,
        0,
        Math.PI * 2
      );


      ctx.strokeStyle =
        "rgba(255,255,255,0.7)";


      ctx.lineWidth =
        2;


      ctx.stroke();

    }


    // =====================================================
    // GET POINT
    // =====================================================

    function getPoint(
      point
    ) {

      return {

        x:
          point.x *
          canvas.width,

        y:
          point.y *
          canvas.height

      };

    }


    // =====================================================
    // SHUTTER
    // =====================================================

    shutter.addEventListener(
      "click",
      takePhoto
    );


    // =====================================================
    // TAKE PHOTO
    // =====================================================

    function takePhoto() {

      if (!stream) {

        instruction.textContent =
          "📷 Kamera belum aktif";

        return;

      }


      // =================================================
      // FLASH
      // =================================================

      flash.style.opacity =
        "1";


      setTimeout(
        () => {

          flash.style.opacity =
            "0";

        },
        120
      );


      // =================================================
      // BUAT CANVAS FOTO
      // =================================================

      const photo =
        document.createElement(
          "canvas"
        );


      photo.width =
        video.videoWidth;


      photo.height =
        video.videoHeight;


      const photoCtx =
        photo.getContext(
          "2d"
        );


      // =================================================
      // GAMBAR VIDEO
      // =================================================

      photoCtx.drawImage(
        video,
        0,
        0,
        photo.width,
        photo.height
      );


      // =================================================
      // DOWNLOAD
      // =================================================

      const link =
        document.createElement(
          "a"
        );


      link.download =
        "gesture-photo-" +
        Date.now() +
        ".jpg";


      link.href =
        photo.toDataURL(
          "image/jpeg",
          0.95
        );


      link.click();


      instruction.textContent =
        "📸 Foto berhasil diambil!";

    }


    // =====================================================
    // PAGE LOAD
    // =====================================================

    resizeCanvas();


    console.log(
      "Hand Gesture Camera siap."
    );


  </script>

</body>

</html>
