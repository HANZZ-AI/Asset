<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#000000">

  <title>Hand Frame AR</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* =========================
       CAMERA
    ========================= */

    #camera {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #000;

      z-index: 1;
    }

    /* =========================
       EFFECT CANVAS
    ========================= */

    #effectCanvas {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 5;
    }

    /* =========================
       UI
    ========================= */

    #topBar {
      position: fixed;

      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      padding: 10px 18px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.55);

      color: white;

      font-size: 14px;

      backdrop-filter: blur(10px);

      white-space: nowrap;
    }

    #startButton {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 30;

      border: none;

      padding: 18px 26px;

      border-radius: 18px;

      background: white;

      color: #111;

      font-size: 17px;

      font-weight: bold;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.5);

      cursor: pointer;
    }

    #startButton:active {
      transform:
        translate(-50%, -50%)
        scale(0.96);
    }

    #instruction {
      position: fixed;

      left: 50%;
      bottom: 100px;

      transform: translateX(-50%);

      width: 90%;

      z-index: 20;

      text-align: center;

      color: white;

      font-size: 15px;

      text-shadow:
        0 2px 8px #000;
    }

    /* =========================
       SHUTTER
    ========================= */

    #shutter {
      position: fixed;

      left: 50%;
      bottom: 22px;

      transform: translateX(-50%);

      width: 68px;
      height: 68px;

      border-radius: 50%;

      border: 5px solid white;

      background: rgba(255,255,255,0.15);

      z-index: 25;

      display: none;

      padding: 0;
    }

    #shutter::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      width: 48px;
      height: 48px;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background: white;
    }

    /* =========================
       ERROR
    ========================= */

    #errorBox {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: calc(100% - 40px);
      max-width: 420px;

      z-index: 100;

      display: none;

      padding: 24px;

      border-radius: 22px;

      background:
        rgba(15,15,15,0.96);

      color: white;

      text-align: center;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.7);
    }

    #errorBox h2 {
      margin-top: 0;
    }

    #errorText {
      font-size: 14px;
      line-height: 1.5;

      color: #ddd;

      word-break: break-word;
    }

    #retryButton {
      border: none;

      padding: 12px 22px;

      border-radius: 12px;

      background: white;

      color: black;

      font-weight: bold;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      position: fixed;

      inset: 0;

      z-index: 90;

      display: none;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      background:
        rgba(0,0,0,0.65);

      color: white;

      backdrop-filter: blur(8px);
    }

    .spinner {
      width: 42px;
      height: 42px;

      border: 4px solid rgba(255,255,255,0.25);

      border-top-color: white;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

      margin-bottom: 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <!-- CAMERA -->
  <video
    id="camera"
    autoplay
    playsinline
    muted
  ></video>


  <!-- EFFECT -->
  <canvas id="effectCanvas"></canvas>


  <!-- STATUS -->
  <div id="topBar">
    Kamera belum aktif
  </div>


  <!-- START -->
  <button id="startButton">
    📷 Aktifkan Kamera Belakang
  </button>


  <!-- INSTRUCTION -->
  <div id="instruction">
    Buat frame dengan kedua tangan
  </div>


  <!-- SHUTTER -->
  <button id="shutter"></button>


  <!-- LOADING -->
  <div id="loading">
    <div class="spinner"></div>

    <div id="loadingText">
      Memuat Hand Tracking...
    </div>
  </div>


  <!-- ERROR -->
  <div id="errorBox">

    <h2>❌ Terjadi masalah</h2>

    <div id="errorText"></div>

    <br>

    <button id="retryButton">
      Coba Lagi
    </button>

  </div>


  <script type="module">

    /* =====================================================
       KONFIGURASI
    ===================================================== */

    const MP_VERSION = "0.10.18";

    const MP_PACKAGE =
      `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;

    const WASM_URL =
      `${MP_PACKAGE}/wasm`;

    const MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/" +
      "hand_landmarker/hand_landmarker/float16/1/" +
      "hand_landmarker.task";


    /* =====================================================
       ELEMENT
    ===================================================== */

    const video =
      document.getElementById("camera");

    const canvas =
      document.getElementById("effectCanvas");

    const ctx =
      canvas.getContext("2d");

    const startButton =
      document.getElementById("startButton");

    const shutter =
      document.getElementById("shutter");

    const status =
      document.getElementById("topBar");

    const instruction =
      document.getElementById("instruction");

    const loading =
      document.getElementById("loading");

    const loadingText =
      document.getElementById("loadingText");

    const errorBox =
      document.getElementById("errorBox");

    const errorText =
      document.getElementById("errorText");

    const retryButton =
      document.getElementById("retryButton");


    /* =====================================================
       STATE
    ===================================================== */

    let handLandmarker = null;

    let cameraStream = null;

    let lastVideoTime = -1;

    let currentFrame = null;

    let animationTime = 0;

    let processing = false;


    /* =====================================================
       RESIZE
    ===================================================== */

    function resizeCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

    }

    resizeCanvas();

    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(message) {

      console.error(message);

      errorText.textContent =
        message;

      errorBox.style.display =
        "block";

    }


    function hideError() {

      errorBox.style.display =
        "none";

    }


    /* =====================================================
       START
    ===================================================== */

    startButton.addEventListener(
      "click",
      startCamera
    );


    retryButton.addEventListener(
      "click",
      () => {

        hideError();

        startCamera();

      }
    );


    async function startCamera() {

      if (processing)
        return;

      processing = true;

      hideError();

      startButton.style.display =
        "none";


      /*
       =====================================================
       PENTING:

       KAMERA DIMINTA TERLEBIH DAHULU.

       Jadi MediaPipe tidak bisa mencegah
       browser menampilkan permission.
       =====================================================
      */

      try {

        status.textContent =
          "Meminta izin kamera...";


        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Browser tidak mendukung kamera atau website tidak berjalan melalui HTTPS."
          );

        }


        /*
          KAMERA BELAKANG
        */

        cameraStream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              facingMode: {
                exact: "environment"
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }

            },

            audio: false

          });


      }

      catch (cameraError) {

        /*
          Kalau exact environment gagal,
          coba lagi dengan ideal environment.
        */

        console.warn(
          "Kamera belakang exact gagal:",
          cameraError
        );


        try {

          cameraStream =
            await navigator.mediaDevices.getUserMedia({

              video: {

                facingMode: {
                  ideal: "environment"
                },

                width: {
                  ideal: 1280
                },

                height: {
                  ideal: 720
                }

              },

              audio: false

            });

        }

        catch (secondError) {

          processing = false;

          startButton.style.display =
            "block";

          status.textContent =
            "Kamera gagal";

          showError(
            getCameraErrorMessage(secondError)
          );

          return;

        }

      }


      /*
       =====================================================
       KAMERA BERHASIL
       =====================================================
      */

      video.srcObject =
        cameraStream;


      try {

        await video.play();

      }

      catch (e) {

        console.warn(
          "video.play():",
          e
        );

      }


      status.textContent =
        "📷 Kamera aktif";


      shutter.style.display =
        "block";


      /*
       =====================================================
       BARU SEKARANG LOAD MEDIAPIPE
       =====================================================
      */

      loading.style.display =
        "flex";

      loadingText.textContent =
        "Memuat Hand Tracking...";


      try {

        await loadMediaPipe();

      }

      catch (mpError) {

        processing = false;

        loading.style.display =
          "none";

        status.textContent =
          "Kamera aktif • Hand Tracking gagal";

        instruction.textContent =
          "Kamera sudah aktif, tetapi Hand Tracking gagal dimuat.";

        showError(
          "Kamera berhasil dibuka, tetapi Hand Tracking gagal dimuat.\n\n" +
          mpError.message
        );

        return;

      }


      loading.style.display =
        "none";


      processing = false;


      status.textContent =
        "🟢 Hand Tracking aktif";

      instruction.textContent =
        "👐 Arahkan kedua tangan dan bentuk frame";


      requestAnimationFrame(
        detectionLoop
      );

    }


    /* =====================================================
       CAMERA ERROR MESSAGE
    ===================================================== */

    function getCameraErrorMessage(error) {

      const name =
        error?.name || "";

      if (name === "NotAllowedError") {

        return (
          "Izin kamera ditolak.\n\n" +
          "Buka pengaturan izin kamera untuk browser " +
          "dan izinkan website ini menggunakan kamera."
        );

      }


      if (name === "NotFoundError") {

        return (
          "Kamera tidak ditemukan pada perangkat."
        );

      }


      if (name === "NotReadableError") {

        return (
          "Kamera sedang digunakan aplikasi lain."
        );

      }


      if (name === "SecurityError") {

        return (
          "Browser memblokir akses kamera. " +
          "Pastikan website dibuka melalui HTTPS."
        );

      }


      return (
        "Kamera tidak dapat dibuka.\n\n" +
        error.message
      );

    }


    /* =====================================================
       LOAD MEDIAPIPE
    ===================================================== */

    async function loadMediaPipe() {

      loadingText.textContent =
        "Menghubungkan MediaPipe...";


      /*
        Import package yang dipin versinya.

        Bukan @latest.
      */

      const vision =
        await import(
          `${MP_PACKAGE}/vision_bundle.mjs`
        );


      const {
        HandLandmarker,
        FilesetResolver
      } = vision;


      if (
        !HandLandmarker ||
        !FilesetResolver
      ) {

        throw new Error(
          "HandLandmarker atau FilesetResolver tidak tersedia dari MediaPipe."
        );

      }


      loadingText.textContent =
        "Memuat mesin Hand Tracking...";


      const filesetResolver =
        await FilesetResolver.forVisionTasks(
          WASM_URL
        );


      loadingText.textContent =
        "Memuat model tangan...";


      handLandmarker =
        await HandLandmarker.createFromOptions(
          filesetResolver,
          {

            baseOptions: {

              modelAssetPath:
                MODEL_URL,

              /*
                GPU lebih cepat,
                tetapi beberapa HP/browser
                bisa bermasalah.

                Kita coba GPU dahulu.
              */

              delegate: "GPU"

            },

            runningMode: "VIDEO",

            numHands: 2,

            minHandDetectionConfidence:
              0.5,

            minHandPresenceConfidence:
              0.5,

            minTrackingConfidence:
              0.5

          }
        );


      console.log(
        "MediaPipe berhasil dimuat."
      );

    }


    /* =====================================================
       DETECTION LOOP
    ===================================================== */

    function detectionLoop() {

      animationTime += 0.025;


      if (
        handLandmarker &&
        video.readyState >= 2
      ) {

        if (
          video.currentTime !==
          lastVideoTime
        ) {

          lastVideoTime =
            video.currentTime;


          try {

            const result =
              handLandmarker.detectForVideo(
                video,
                performance.now()
              );


            processHands(result);

          }

          catch (e) {

            console.error(
              "Detection error:",
              e
            );

          }

        }

      }


      requestAnimationFrame(
        detectionLoop
      );

    }


    /* =====================================================
       HAND PROCESSING
    ===================================================== */

    function processHands(result) {

      currentFrame = null;


      if (
        !result ||
        !result.landmarks ||
        result.landmarks.length < 2
      ) {

        status.textContent =
          "🟡 Mencari kedua tangan";

        instruction.textContent =
          "Tunjukkan kedua tangan";

        drawEmpty();

        return;

      }


      const handA =
        result.landmarks[0];

      const handB =
        result.landmarks[1];


      /*
       =====================================================
       LANDMARK

       4 = ibu jari
       8 = telunjuk
       =====================================================
      */

      const thumbA =
        normalizedPoint(
          handA[4]
        );

      const indexA =
        normalizedPoint(
          handA[8]
        );

      const thumbB =
        normalizedPoint(
          handB[4]
        );

      const indexB =
        normalizedPoint(
          handB[8]
        );


      /*
       =====================================================
       FRAME DARI EMPAT UJUNG JARI
       =====================================================
      */

      const minX =
        Math.min(
          thumbA.x,
          indexA.x,
          thumbB.x,
          indexB.x
        );

      const maxX =
        Math.max(
          thumbA.x,
          indexA.x,
          thumbB.x,
          indexB.x
        );

      const minY =
        Math.min(
          thumbA.y,
          indexA.y,
          thumbB.y,
          indexB.y
        );

      const maxY =
        Math.max(
          thumbA.y,
          indexA.y,
          thumbB.y,
          indexB.y
        );


      let x =
        minX;

      let y =
        minY;

      let width =
        maxX - minX;

      let height =
        maxY - minY;


      /*
       =====================================================
       MINIMUM FRAME
       =====================================================
      */

      if (
        width < 0.12 ||
        height < 0.08
      ) {

        status.textContent =
          "🟡 Dekatkan kedua tangan";

        instruction.textContent =
          "Rentangkan kedua tangan sedikit";

        drawEmpty();

        return;

      }


      /*
       =====================================================
       PADDING
       =====================================================
      */

      const paddingX =
        width * 0.12;

      const paddingY =
        height * 0.20;


      x -= paddingX;

      y -= paddingY;

      width +=
        paddingX * 2;

      height +=
        paddingY * 2;


      /*
       =====================================================
       LIMIT
       =====================================================
      */

      x =
        Math.max(
          0,
          x
        );

      y =
        Math.max(
          0,
          y
        );

      width =
        Math.min(
          1 - x,
          width
        );

      height =
        Math.min(
          1 - y,
          height
        );


      currentFrame = {

        x:
          x *
          canvas.width,

        y:
          y *
          canvas.height,

        width:
          width *
          canvas.width,

        height:
          height *
          canvas.height

      };


      status.textContent =
        "🟢 FRAME TERDETEKSI";

      instruction.textContent =
        "✨ Frame aktif — gerakkan tangan";


      drawFrame();

    }


    /* =====================================================
       POINT
    ===================================================== */

    function normalizedPoint(point) {

      return {

        x: point.x,

        y: point.y

      };

    }


    /* =====================================================
       EMPTY
    ===================================================== */

    function drawEmpty() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

    }


    /* =====================================================
       DRAW FRAME
    ===================================================== */

    function drawFrame() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      if (!currentFrame)
        return;


      const {
        x,
        y,
        width,
        height
      } = currentFrame;


      /*
       =====================================================
       GELAPKAN AREA LUAR
       =====================================================
      */

      ctx.save();


      ctx.fillStyle =
        "rgba(0,0,0,0.42)";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
       =====================================================
       LUBANG FRAME
       =====================================================
      */

      ctx.globalCompositeOperation =
        "destination-out";


      ctx.fillRect(
        x,
        y,
        width,
        height
      );


      ctx.restore();


      /*
       =====================================================
       WARNA PSYCHEDELIC
       =====================================================
      */

      ctx.save();


      ctx.beginPath();

      ctx.rect(
        x,
        y,
        width,
        height
      );

      ctx.clip();


      const g =
        ctx.createLinearGradient(
          x,
          y,
          x + width,
          y + height
        );


      const hue =
        (animationTime * 90) % 360;


      g.addColorStop(
        0,
        `hsla(${hue},100%,55%,0.38)`
      );

      g.addColorStop(
        0.25,
        `hsla(${hue + 70},100%,55%,0.38)`
      );

      g.addColorStop(
        0.5,
        `hsla(${hue + 150},100%,55%,0.38)`
      );

      g.addColorStop(
        0.75,
        `hsla(${hue + 230},100%,55%,0.38)`
      );

      g.addColorStop(
        1,
        `hsla(${hue + 310},100%,55%,0.38)`
      );


      ctx.fillStyle =
        g;


      ctx.fillRect(
        x,
        y,
        width,
        height
      );


      /*
       =====================================================
       GLITCH LINES
       =====================================================
      */

      for (
        let i = 0;
        i < 18;
        i++
      ) {

        const lineY =
          y +
          (
            (
              i / 18 +
              animationTime * 0.03
            ) % 1
          ) *
          height;


        const lineHue =
          (
            hue +
            i * 27
          ) % 360;


        ctx.fillStyle =
          `hsla(${lineHue},100%,60%,0.16)`;


        ctx.fillRect(
          x,
          lineY,
          width,
          Math.max(
            2,
            height / 40
          )
        );

      }


      /*
       =====================================================
       SCAN LINE
       =====================================================
      */

      const scanY =
        y +
        (
          (
            animationTime * 0.8
          ) % 1
        ) *
        height;


      ctx.fillStyle =
        "rgba(255,255,255,0.28)";


      ctx.fillRect(
        x,
        scanY,
        width,
        2
      );


      ctx.restore();


      /*
       =====================================================
       FRAME BORDER
       =====================================================
      */

      ctx.save();


      ctx.strokeStyle =
        "rgba(255,255,255,0.95)";

      ctx.lineWidth =
        3;

      ctx.shadowBlur =
        18;

      ctx.shadowColor =
        "cyan";


      ctx.strokeRect(
        x,
        y,
        width,
        height
      );


      ctx.restore();


      /*
       =====================================================
       CORNERS
       =====================================================
      */

      drawCorners(
        x,
        y,
        width,
        height
      );

    }


    /* =====================================================
       CORNERS
    ===================================================== */

    function drawCorners(
      x,
      y,
      width,
      height
    ) {

      const size =
        Math.min(
          38,
          width * 0.15,
          height * 0.25
        );


      ctx.save();


      ctx.strokeStyle =
        "white";

      ctx.lineWidth =
        5;

      ctx.lineCap =
        "round";

      ctx.shadowBlur =
        15;

      ctx.shadowColor =
        "#00ffff";


      /*
       TOP LEFT
      */

      ctx.beginPath();

      ctx.moveTo(
        x,
        y + size
      );

      ctx.lineTo(
        x,
        y
      );

      ctx.lineTo(
        x + size,
        y
      );

      ctx.stroke();


      /*
       TOP RIGHT
      */

      ctx.beginPath();

      ctx.moveTo(
        x + width - size,
        y
      );

      ctx.lineTo(
        x + width,
        y
      );

      ctx.lineTo(
        x + width,
        y + size
      );

      ctx.stroke();


      /*
       BOTTOM LEFT
      */

      ctx.beginPath();

      ctx.moveTo(
        x,
        y + height - size
      );

      ctx.lineTo(
        x,
        y + height
      );

      ctx.lineTo(
        x + size,
        y + height
      );

      ctx.stroke();


      /*
       BOTTOM RIGHT
      */

      ctx.beginPath();

      ctx.moveTo(
        x + width - size,
        y + height
      );

      ctx.lineTo(
        x + width,
        y + height
      );

      ctx.lineTo(
        x + width,
        y + height - size
      );

      ctx.stroke();


      ctx.restore();

    }


    /* =====================================================
       FOTO
    ===================================================== */

    shutter.addEventListener(
      "click",
      takePhoto
    );


    function takePhoto() {

      if (!video.videoWidth)
        return;


      const output =
        document.createElement(
          "canvas"
        );


      output.width =
        video.videoWidth;

      output.height =
        video.videoHeight;


      const octx =
        output.getContext("2d");


      /*
       =====================================================
       MIRROR TIDAK DIGUNAKAN

       Karena kamera belakang.
       =====================================================
      */

      octx.drawImage(
        video,
        0,
        0,
        output.width,
        output.height
      );


      /*
       =====================================================
       DOWNLOAD FOTO
       =====================================================
      */

      const link =
        document.createElement("a");


      link.download =
        `hand-frame-${Date.now()}.jpg`;


      link.href =
        output.toDataURL(
          "image/jpeg",
          0.95
        );


      link.click();

    }

  </script>

</body>
</html>
