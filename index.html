<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Hand Frame Camera</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #video {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    #canvas {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }

    #topBar {
      position: fixed;
      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      padding: 10px 18px;

      border-radius: 30px;

      background: rgba(0, 0, 0, 0.65);
      color: white;

      font-size: 14px;

      z-index: 10;

      backdrop-filter: blur(10px);
    }

    #start {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      padding: 16px 24px;

      border: none;
      border-radius: 15px;

      background: white;
      color: black;

      font-size: 16px;
      font-weight: bold;

      z-index: 20;
    }

    #instruction {
      position: fixed;

      bottom: 90px;
      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 40px);
      max-width: 450px;

      padding: 12px 18px;

      text-align: center;

      color: white;

      background: rgba(0, 0, 0, 0.55);

      border-radius: 15px;

      z-index: 10;
    }

    #shutter {
      position: fixed;

      left: 50%;
      bottom: 20px;

      transform: translateX(-50%);

      width: 64px;
      height: 64px;

      border-radius: 50%;

      border: 5px solid white;

      background: rgba(255, 255, 255, 0.2);

      z-index: 15;

      display: none;
    }

    #shutter:active {
      transform: translateX(-50%) scale(0.9);
    }

    #flash {
      position: fixed;
      inset: 0;

      background: white;

      opacity: 0;

      pointer-events: none;

      z-index: 100;
    }
  </style>
</head>

<body>

  <!-- KAMERA -->
  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>

  <!-- OVERLAY HAND TRACKING -->
  <canvas id="canvas"></canvas>

  <!-- STATUS -->
  <div id="topBar">
    Kamera belum aktif
  </div>

  <!-- INSTRUKSI -->
  <div id="instruction">
    Bentuk huruf L dengan kedua tangan
  </div>

  <!-- START -->
  <button id="start">
    📷 Aktifkan Kamera Belakang
  </button>

  <!-- SHUTTER -->
  <button id="shutter"></button>

  <!-- FLASH -->
  <div id="flash"></div>


  <script type="module">

    import {
      HandLandmarker,
      FilesetResolver
    } from
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";


    // =========================================================
    // ELEMENT
    // =========================================================

    const video =
      document.getElementById("video");

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");

    const start =
      document.getElementById("start");

    const shutter =
      document.getElementById("shutter");

    const flash =
      document.getElementById("flash");

    const topBar =
      document.getElementById("topBar");

    const instruction =
      document.getElementById("instruction");


    // =========================================================
    // VARIABLES
    // =========================================================

    let handLandmarker = null;

    let stream = null;

    let lastVideoTime = -1;

    let frameActive = false;


    // =========================================================
    // START CAMERA
    // =========================================================

    async function startCamera() {

      try {

        topBar.textContent =
          "Meminta akses kamera...";


        // Kamera belakang
        try {

          stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: {
                  exact: "environment"
                },

                width: {
                  ideal: 1280
                },

                height: {
                  ideal: 720
                }
              },

              audio: false

            });

        } catch (error) {

          // fallback

          stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "environment"
              },

              audio: false

            });

        }


        video.srcObject = stream;

        await video.play();


        start.style.display = "none";

        shutter.style.display = "block";


        resizeCanvas();


        topBar.textContent =
          "Memuat hand tracking...";


        await createHandTracker();


        topBar.textContent =
          "Kamera belakang aktif";


        requestAnimationFrame(loop);


      } catch (error) {

        console.error(error);

        topBar.textContent =
          "❌ Kamera gagal dibuka";

        instruction.textContent =
          "Izinkan akses kamera dan gunakan HTTPS/localhost.";

      }

    }


    // =========================================================
    // MEDIAPIPE
    // =========================================================

    async function createHandTracker() {

      const vision =
        await FilesetResolver.forVisionTasks(

          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


      handLandmarker =
        await HandLandmarker.createFromOptions(

          vision,

          {

            baseOptions: {

              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

              delegate: "GPU"

            },

            runningMode: "VIDEO",

            numHands: 2,

            minHandDetectionConfidence: 0.5,

            minHandPresenceConfidence: 0.5,

            minTrackingConfidence: 0.5

          }

        );

    }


    // =========================================================
    // CANVAS
    // =========================================================

    function resizeCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    // =========================================================
    // MAIN LOOP
    // =========================================================

    function loop() {

      if (
        !handLandmarker ||
        video.readyState < 2
      ) {

        requestAnimationFrame(loop);

        return;

      }


      if (
        video.currentTime !==
        lastVideoTime
      ) {

        lastVideoTime =
          video.currentTime;


        const results =
          handLandmarker.detectForVideo(

            video,

            performance.now()

          );


        processHands(results);

      }


      requestAnimationFrame(loop);

    }


    // =========================================================
    // HITUNG JARAK
    // =========================================================

    function distance(a, b) {

      return Math.sqrt(

        Math.pow(a.x - b.x, 2) +

        Math.pow(a.y - b.y, 2)

      );

    }


    // =========================================================
    // DETEKSI GESTURE L
    // =========================================================

    function isLGesture(hand) {

      /*
       * MediaPipe landmark:
       *
       * 4  = ujung ibu jari
       * 8  = ujung telunjuk
       *
       * 12 = ujung jari tengah
       * 16 = ujung jari manis
       * 20 = ujung kelingking
       *
       * 6  = ruas telunjuk
       * 10 = ruas tengah
       * 14 = ruas manis
       * 18 = ruas kelingking
       */


      const thumbTip =
        hand[4];

      const indexTip =
        hand[8];

      const middleTip =
        hand[12];

      const ringTip =
        hand[16];

      const pinkyTip =
        hand[20];


      const indexBase =
        hand[5];

      const middleBase =
        hand[9];

      const ringBase =
        hand[13];

      const pinkyBase =
        hand[17];


      // ---------------------------------------------
      // TELUNJUK HARUS TERBUKA
      // ---------------------------------------------

      const indexExtended =
        distance(
          indexTip,
          indexBase
        ) > 0.15;


      // ---------------------------------------------
      // JARI LAIN HARUS CENDERUNG TERLIPAT
      // ---------------------------------------------

      const middleFolded =
        distance(
          middleTip,
          middleBase
        ) < 0.13;


      const ringFolded =
        distance(
          ringTip,
          ringBase
        ) < 0.13;


      const pinkyFolded =
        distance(
          pinkyTip,
          pinkyBase
        ) < 0.13;


      // ---------------------------------------------
      // IBU JARI HARUS TERBUKA KE SAMPING
      // ---------------------------------------------

      const thumbOpen =
        distance(
          thumbTip,
          indexBase
        ) > 0.10;


      return (

        indexExtended &&

        middleFolded &&

        ringFolded &&

        pinkyFolded &&

        thumbOpen

      );

    }


    // =========================================================
    // PROCESS HANDS
    // =========================================================

    function processHands(results) {

      ctx.clearRect(

        0,
        0,
        canvas.width,
        canvas.height

      );


      if (
        !results.landmarks ||
        results.landmarks.length === 0
      ) {

        frameActive = false;

        instruction.textContent =
          "✋ Tunjukkan kedua tangan";

        return;

      }


      // ---------------------------------------------
      // GAMBAR LANDMARK
      // ---------------------------------------------

      drawHands(results);


      // ---------------------------------------------
      // CARI TANGAN YANG MEMBENTUK L
      // ---------------------------------------------

      const LHands = [];


      for (
        const hand of results.landmarks
      ) {

        if (
          isLGesture(hand)
        ) {

          LHands.push(hand);

        }

      }


      // =====================================================
      // DUA TANGAN MEMBENTUK L
      // =====================================================

      if (LHands.length >= 2) {

        createFrame(

          LHands[0],

          LHands[1]

        );

        return;

      }


      // =====================================================
      // SATU TANGAN
      // =====================================================

      frameActive = false;

      instruction.textContent =
        "🖐️ Buat gesture L dengan kedua tangan";

    }


    // =========================================================
    // GAMBAR LANDMARK
    // =========================================================

    function drawHands(results) {

      for (
        const hand of results.landmarks
      ) {

        for (
          const point of hand
        ) {

          const x =
            point.x *
            canvas.width;

          const y =
            point.y *
            canvas.height;


          ctx.beginPath();

          ctx.arc(
            x,
            y,
            4,
            0,
            Math.PI * 2
          );


          ctx.fillStyle =
            "rgba(255,255,255,0.8)";

          ctx.fill();

        }

      }

    }


    // =========================================================
    // BUAT FRAME
    // =========================================================

    function createFrame(
      hand1,
      hand2
    ) {

      /*
       * Kita menggunakan ujung telunjuk
       * sebagai titik atas frame.
       *
       * Kemudian ujung ibu jari sebagai
       * titik bawah frame.
       */


      const p1 =
        getPoint(hand1[8]);

      const p2 =
        getPoint(hand2[8]);

      const p3 =
        getPoint(hand2[4]);

      const p4 =
        getPoint(hand1[4]);


      const minX =
        Math.min(
          p1.x,
          p2.x,
          p3.x,
          p4.x
        );


      const maxX =
        Math.max(
          p1.x,
          p2.x,
          p3.x,
          p4.x
        );


      const minY =
        Math.min(
          p1.y,
          p2.y,
          p3.y,
          p4.y
        );


      const maxY =
        Math.max(
          p1.y,
          p2.y,
          p3.y,
          p4.y
        );


      const width =
        maxX - minX;

      const height =
        maxY - minY;


      // Frame terlalu kecil
      if (
        width < 80 ||
        height < 80
      ) {

        instruction.textContent =
          "↔️ Jauhkan kedua tangan";

        return;

      }


      frameActive = true;


      // =====================================================
      // FRAME
      // =====================================================

      ctx.beginPath();

      ctx.moveTo(
        p1.x,
        p1.y
      );

      ctx.lineTo(
        p2.x,
        p2.y
      );

      ctx.lineTo(
        p3.x,
        p3.y
      );

      ctx.lineTo(
        p4.x,
        p4.y
      );

      ctx.closePath();


      /*
       * Frame hijau
       */

      ctx.strokeStyle =
        "#00ff88";

      ctx.lineWidth = 5;

      ctx.shadowBlur = 20;

      ctx.shadowColor =
        "#00ff88";

      ctx.stroke();


      ctx.shadowBlur = 0;


      // =====================================================
      // KOTAK TENGAH
      // =====================================================

      const centerX =
        (minX + maxX) / 2;

      const centerY =
        (minY + maxY) / 2;


      ctx.fillStyle =
        "rgba(0,255,136,0.08)";

      ctx.fillRect(
        minX,
        minY,
        width,
        height
      );


      // =====================================================
      // INFO
      // =====================================================

      instruction.textContent =
        "🟢 FRAME AKTIF — tekan shutter 📸";

    }


    // =========================================================
    // KONVERSI POINT
    // =========================================================

    function getPoint(point) {

      return {

        x:
          point.x *
          canvas.width,

        y:
          point.y *
          canvas.height

      };

    }


    // =========================================================
    // FOTO
    // =========================================================

    function takePhoto() {

      if (!frameActive) {

        instruction.textContent =
          "Buat frame dengan kedua tangan dulu!";

        return;

      }


      // =====================================================
      // FLASH
      // =====================================================

      flash.style.opacity = "1";


      setTimeout(() => {

        flash.style.opacity = "0";

      }, 120);


      // =====================================================
      // CANVAS FOTO
      // =====================================================

      const photo =
        document.createElement("canvas");

      photo.width =
        video.videoWidth;

      photo.height =
        video.videoHeight;


      const photoCtx =
        photo.getContext("2d");


      photoCtx.drawImage(

        video,

        0,
        0,

        photo.width,
        photo.height

      );


      // =====================================================
      // DOWNLOAD
      // =====================================================

      const link =
        document.createElement("a");

      link.download =
        `gesture-photo-${Date.now()}.jpg`;


      link.href =
        photo.toDataURL(
          "image/jpeg",
          0.95
        );


      link.click();


      instruction.textContent =
        "📸 Foto berhasil diambil!";

    }


    // =========================================================
    // EVENT
    // =========================================================

    start.addEventListener(
      "click",
      startCamera
    );


    shutter.addEventListener(
      "click",
      takePhoto
    );

  </script>

</body>
</html>
